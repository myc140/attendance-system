<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新增学生</title>
    <style>
        body { font-family: "微软雅黑", sans-serif; margin: 30px; max-width: 600px; }
        .form-item { margin-bottom: 15px; }
        label { display: inline-block; width: 80px; }
        input { padding: 4px; width: 200px; }
        .btn-submit {
            padding: 6px 15px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-back {
            padding: 6px 15px;
            background-color: #999;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>新增学生</h2>

<form>
    <div class="form-item">
        <label>学号：</label>
        <input type="text" required>
    </div>
    <div class="form-item">
        <label>姓名：</label>
        <input type="text" required>
    </div>
    <div class="form-item">
        <label>班级：</label>
        <input type="text" required>
    </div>
    <div class="form-item">
        <label>性别：</label>
        <input type="text" required>
    </div>
    <div class="form-item">
        <label>生日：</label>
        <input type="date" required>
    </div>
    <div class="form-item">
        <label>手机号：</label>
        <input type="text" required>
    </div>

    <button type="button" class="btn-submit" onclick="alert('提交功能调试中')">提交</button>
    <button type="button" class="btn-back" onclick="history.back()">返回</button>
</form>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <link rel="stylesheet" th:href="@{/static/style.css}">
</head>
<body>
<div class="container">
    <h2>用户注册</h2>
    <div th:if="${error != null}" class="alert error" th:text="${error}"></div>
    <div th:if="${success != null}" class="alert success" th:text="${success}"></div>

    <form th:action="@{/user/register-page}" method="post">
        <div class="form-group">
            <label>用户名：</label>
            <input type="text" name="username" required placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label>密码：</label>
            <input type="password" name="password" required placeholder="请输入密码">
        </div>
        <div class="form-group">
            <label>确认密码：</label>
            <input type="password" name="confirmPassword" required placeholder="请再次输入密码">
        </div>
        <button type="submit" class="btn">注册</button>
    </form>
    <p>已有账号？<a th:href="@{/user/login-page}">去登录</a ></p >
</div>
</body>
</html>
